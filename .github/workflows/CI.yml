name: CI

on:
  push:
    branches:
      - new
    paths-ignore:
      - .gitignore
      - README.md
      - svenbxt.cfg
  pull_request:
    paths-ignore:
      - .gitignore
      - README.md
      - svenbxt.cfg
  workflow_dispatch:
  schedule:
    - cron: '0 0 1 * *' # Monthly

jobs:
  build:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, windows-2022]
        build_type: [Release]
        c_compiler: [gcc, cl]
        include:
          - os: windows-2022
            c_compiler: cl
            cpp_compiler: cl
            artifact: "svenbxt_windows-cl"
            bin-path: "src/build/Release/SvenBXT.dll"
            toolchain-file: ""
            cmake-generator: "Visual Studio 17 2022"
            build-target: "-A Win32" # HACK
          - os: ubuntu-latest
            c_compiler: gcc
            cpp_compiler: g++
            artifact: "svenbxt_ubuntu-gcc"
            bin-path: "src/build/libSvenBXT.so"
            toolchain-file: "cmake/ToolchainLinuxGCC.cmake"
            cmake-generator: "Unix Makefiles"
            build-target: ""
        exclude:
          - os: windows-2022
            c_compiler: gcc
          - os: ubuntu-latest
            c_compiler: cl

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Checkout submodules
        shell: bash
        run: git submodule update --init --recursive

      - name: Set reusable strings
        id: strings
        shell: bash
        run: |
          echo "build-output-dir=${{ github.workspace }}/src/build" >> "$GITHUB_OUTPUT"
          echo "src-dir=${{ github.workspace }}/src" >> "$GITHUB_OUTPUT"

      - name: Add msbuild to PATH
        if: runner.os == 'Windows'
        uses: microsoft/setup-msbuild@v2

      - name: Install Ubuntu packages
        if: runner.os == 'Linux'
        run: |
          sudo dpkg --add-architecture i386
          sudo apt update || true
          sudo apt install -y build-essential libc6:i386 g++-multilib mesa-common-dev libgl-dev:i386 libgl1-mesa-dev

      - name: Configure CMake
        run: >
          cmake -G "${{ matrix.cmake-generator }}"
          ${{ matrix.build-target }}
          -B ${{ steps.strings.outputs.build-output-dir }}
          -DCMAKE_CXX_COMPILER=${{ matrix.cpp_compiler }}
          -DCMAKE_C_COMPILER=${{ matrix.c_compiler }}
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DCMAKE_TOOLCHAIN_FILE=${{ matrix.toolchain-file }}
          -DFUNCHOOK_BUILD_TESTS=OFF
          -S ${{ steps.strings.outputs.src-dir }}

      - name: Build Linux version
        if: runner.os == 'Linux'
        run: cmake --build ${{ steps.strings.outputs.build-output-dir }} --config ${{ matrix.build_type }}

      - name: Build Windows version
        if: runner.os == 'Windows'
        run: cmake --build ${{ steps.strings.outputs.build-output-dir }} --config ${{ matrix.build_type }} --parallel

      - name: Prepare artifacts
        run: mkdir -p bin && mv ${{ matrix.bin-path }} bin/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          path: ./bin
          name: ${{ matrix.artifact }}

  publish-nightly:
    name: Publish latest successful Windows DLL to Releases
    if: github.event_name == 'push' && github.ref == 'refs/heads/new'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: svenbxt-nightly-release
      cancel-in-progress: false
    steps:
      - name: Download the Windows x86 DLL artifact
        uses: actions/download-artifact@v4
        with:
          name: svenbxt_windows-cl
          path: release

      - name: Publish DLL as a standalone GitHub Release asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: nightly
        shell: bash
        run: |
          set -euo pipefail
          test -s release/SvenBXT.dll
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release/SvenBXT.dll --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$RELEASE_TAG" release/SvenBXT.dll \
              --repo "$GITHUB_REPOSITORY" \
              --title "SvenBXT Nightly (Windows x86)" \
              --prerelease \
              --target "$GITHUB_SHA" \
              --notes "Automatic Windows x86 build from commit $GITHUB_SHA. Not yet runtime-tested on all Sven Co-op versions."
          fi
